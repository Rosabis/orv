        cp -f wasm/dist/fs/cfunction_mini.ext dist/windows-arm64/
        test -f wasm/dist/fs/mythroad/cookie.mrp || { echo "missing wasm/dist/fs/mythroad/cookie.mrp"; ls -la wasm/dist/fs/mythroad || true; exit 1; }
        cp -f wasm/dist/fs/mythroad/cookie.mrp dist/windows-arm64/mythroad/
        cp -f /clangarm64/bin/libunicorn.dll /clangarm64/bin/SDL2.dll dist/windows-arm64/
        ldd bin/main.exe | awk '/\/clangarm64\// { print $3 }' | while read -r lib; do
          test -n "$lib" && cp -Lf "$lib" dist/windows-arm64/
        done
        ls -la dist/windows-arm64/

    - name: Encrypt artifact

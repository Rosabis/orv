        fi
        test -f "$PROJECT_DIR/Makefile"
        echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

    - name: Build
      run: |
        eval "$(/usr/local/bin/brew shellenv)"
        cd "$PROJECT_DIR"
        mkdir -p bin
        arch -x86_64 make
        file bin/main

    - name: Package
      run: |
        set -euo pipefail
        eval "$(/usr/local/bin/brew shellenv)"

        cp -f wasm/dist/fs/cfunction_mini.ext "$DIST/"
        test -f wasm/dist/fs/mythroad/cookie.mrp || { echo "missing wasm/dist/fs/mythroad/cookie.mrp"; ls -la wasm/dist/fs/mythroad || true; exit 1; }
        cp -f wasm/dist/fs/mythroad/cookie.mrp "$DIST/mythroad/"
        bundle_homebrew_lib() {
          local src="$1"
          local name
          name="$(basename "$src")"
          local dest="$DIST/lib/$name"
          if [ -f "$dest" ]; then
            return 1
          fi
          cp -L "$src" "$dest"
          install_name_tool -id "@executable_path/lib/$name" "$dest"
          return 0
        }
        rewrite_dep() {
          local target="$1"
          local from="$2"
          install_name_tool -change "$from" "@executable_path/lib/$(basename "$from")" "$target" 2>/dev/null || true
        }
        SDL3_PREFIX="$(arch -x86_64 brew --prefix sdl3)"
        shopt -s nullglob
        for lib in "$SDL3_PREFIX"/lib/libSDL3*.dylib; do
          bundle_homebrew_lib "$lib" || true
        done
        changed=1
        while [ "$changed" -ne 0 ]; do
          changed=0
          scan_targets=("$DIST/main")
          for lib in "$DIST/lib"/*; do
            scan_targets+=("$lib")
          done
          for target in "${scan_targets[@]}"; do
            while read -r dep; do
              test -n "$dep" || continue
              if bundle_homebrew_lib "$dep"; then
                changed=1
              fi
              rewrite_dep "$target" "$dep"
            done < <(otool -L "$target" | awk 'NF && $1 ~ /^\/usr\/local\// { print $1 }')
          done
        done
        install_name_tool -add_rpath @executable_path/lib "$DIST/main" 2>/dev/null || true
        shopt -s nullglob
        for lib in "$DIST/lib"/*; do
          install_name_tool -add_rpath @executable_path/lib "$lib" 2>/dev/null || true
        done
        for lib in "$DIST/lib"/*; do
          codesign --force --sign - --timestamp=none "$lib"
        done
        codesign --force --sign - --timestamp=none "$DIST/main"
        codesign --verify --verbose=2 "$DIST/main"
        otool -L "$DIST/main"
        ls -la "$DIST/" "$DIST/lib/"

    - name: Encrypt artifact
      run: |
        set -euo pipefail
        cd "$PROJECT_DIR"
        test -n "$ARTIFACT_PASSWORD"
        mkdir -p encrypted
        7z a -t7z -mhe=on "-p$ARTIFACT_PASSWORD" encrypted/macos-amd64.7z dist/macos-amd64
        mkdir -p "$WORKSPACE/artifacts"
        cp -f encrypted/macos-amd64.7z "$WORKSPACE/artifacts/"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-amd64-encrypted
        path: ${{ github.workspace }}/artifacts/macos-amd64.7z

  build-windows-amd64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          make
          p7zip
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-unicorn
          mingw-w64-x86_64-SDL2

    - name: Extract source
      run: |
        set -euo pipefail
        test -n "$SOURCE_PASSWORD"
        WORKSPACE="$(pwd)"
        SOURCE_DIR="$WORKSPACE/_source"
        echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
        rm -rf "$SOURCE_DIR"
        mkdir -p "$SOURCE_DIR"
        7z x "$WORKSPACE/$SOURCE_ARCHIVE" "-p$SOURCE_PASSWORD" -o"$SOURCE_DIR" -y
        PROJECT_DIR="$SOURCE_DIR"
        if [ ! -f "$PROJECT_DIR/Makefile" ]; then
          PROJECT_DIR="$(find "$SOURCE_DIR" -maxdepth 2 -name Makefile -print -quit | xargs dirname)"
        fi
        test -f "$PROJECT_DIR/Makefile"
        echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

    - name: Build
      run: |
        cd "$PROJECT_DIR"
        mkdir -p bin
        make clean
        make main OS=Windows_NT MSYS2_MINGW_DIR=/mingw64 OUT=./bin/main.exe
        file bin/main.exe

    - name: Package
      run: |
        cd "$PROJECT_DIR"
        mkdir -p dist/windows-amd64
        cp -f bin/main.exe dist/windows-amd64/
        test -f wasm/dist/fs/cfunction.ext || { echo "missing wasm/dist/fs runtime assets"; ls -la wasm/dist/fs || true; exit 1; }
        cp -f wasm/dist/fs/cfunction.ext dist/windows-amd64/
        cp -R wasm/dist/fs/mythroad dist/windows-amd64/
        test -f wasm/dist/fs/cfunction_mini.ext || { echo "missing wasm/dist/fs/cfunction_mini.ext"; ls -la wasm/dist/fs || true; exit 1; }
        cp -f wasm/dist/fs/cfunction_mini.ext dist/windows-amd64/
        test -f wasm/dist/fs/mythroad/cookie.mrp || { echo "missing wasm/dist/fs/mythroad/cookie.mrp"; ls -la wasm/dist/fs/mythroad || true; exit 1; }
        cp -f wasm/dist/fs/mythroad/cookie.mrp dist/windows-amd64/mythroad/
        cp -f /mingw64/bin/libunicorn.dll /mingw64/bin/SDL2.dll dist/windows-amd64/
        ldd bin/main.exe | awk '/\/mingw64\/|\/ucrt64\// { print $3 }' | while read -r lib; do
          test -n "$lib" && cp -Lf "$lib" dist/windows-amd64/
        done
        ls -la dist/windows-amd64/

    - name: Encrypt artifact
      run: |
        set -euo pipefail
        cd "$PROJECT_DIR"
        test -n "$ARTIFACT_PASSWORD"
        mkdir -p encrypted
        7z a -t7z -mhe=on "-p$ARTIFACT_PASSWORD" encrypted/windows-amd64.7z dist/windows-amd64
        mkdir -p "$WORKSPACE/artifacts"
        cp -f encrypted/windows-amd64.7z "$WORKSPACE/artifacts/"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-amd64-encrypted
        path: ${{ github.workspace }}/artifacts/windows-amd64.7z

  build-windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4

    - name: Set up MSYS2
